packages:
  - packages/*
  - plugins/*
  - docs
  - "!packages/cli/app"

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@fraqjs/*"
  - "@fumadocs/*"
  - "@fumari/*"
  - ai
  - fumadocs-*
  - rolldown-plugin-dts
  - tsdown
  - typescript

allowBuilds:
  esbuild: true
  sharp: true

ignoreWorkspaceCycles: true
